name: Verification task

on:
  workflow_call:
    inputs:
      task-id:
        type: string
        required: true
      source-sha:
        type: string
        required: true
      image-cache-key:
        type: string
        required: true
      build-artifact-id:
        type: string
        default: ''
      build-artifact-digest:
        type: string
        default: ''
    outputs:
      build-artifact-id:
        value: ${{ jobs.task.outputs.build-artifact-id }}
      build-artifact-digest:
        value: ${{ jobs.task.outputs.build-artifact-digest }}

permissions:
  contents: read
  actions: read

jobs:
  task:
    name: ${{ inputs.task-id }}
    runs-on: ubuntu-24.04-arm
    outputs:
      build-artifact-id: ${{ steps.build-artifact.outputs.artifact-id }}
      build-artifact-digest: ${{ steps.build-artifact.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source-sha }}
          fetch-depth: 0
      - name: Read locked bootstrap version
        id: version
        run: node -e "const fs=require('node:fs');const l=JSON.parse(fs.readFileSync('tooling/ci/environment.lock.json','utf8'));fs.appendFileSync(process.env.GITHUB_OUTPUT,'node='+l.node.primary.version+'\n')"
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ steps.version.outputs.node }}
          package-manager-cache: false
      - name: Restore verification image
        id: image-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/fluo-verification-image
          key: ${{ inputs.image-cache-key }}
      - name: Load verification image
        if: steps.image-cache.outputs.cache-hit == 'true'
        run: docker load --input "$RUNNER_TEMP/fluo-verification-image/image.tar"
      - name: Cache integrity-checked pnpm package contents
        uses: actions/cache@v4
        with:
          path: .omo/verification/cache/pnpm
          key: fluo-pnpm-linux-arm64-v10-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: fluo-pnpm-linux-arm64-v10-
      - uses: actions/download-artifact@v5
        with:
          name: ci-plan
          path: .omo/ci-plan
      - name: Acquire provenance-bound primary build
        if: inputs.build-artifact-id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ inputs.build-artifact-id }}
          ARTIFACT_DIGEST: ${{ inputs.build-artifact-digest }}
          SOURCE_SHA: ${{ inputs.source-sha }}
        run: node tooling/ci/acquire-build-artifact.mjs --id "$ARTIFACT_ID" --digest "$ARTIFACT_DIGEST" --sha "$SOURCE_SHA" --name "ci-build-$SOURCE_SHA" --run-id "$GITHUB_RUN_ID" --output .omo/ci/artifacts/build.tar
      - name: Execute the shared Linux task
        env:
          TASK_ID: ${{ inputs.task-id }}
        run: node tooling/ci/verification-runner.mjs --plan .omo/ci-plan/plan.json --task "$TASK_ID" --output .omo/ci/results --artifacts .omo/ci/artifacts
      - name: Upload primary build
        if: inputs.task-id == 'build'
        id: build-artifact
        uses: actions/upload-artifact@v6
        with:
          name: ci-build-${{ inputs.source-sha }}
          path: .omo/ci/artifacts/
          overwrite: true
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - name: Upload standalone documentation preview
        if: inputs.task-id == 'static'
        uses: actions/upload-artifact@v6
        with:
          name: docs-site-${{ inputs.source-sha }}
          path: .omo/ci/artifacts/docs-site
          overwrite: true
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Preserve this attempt's task evidence
        if: ${{ always() }}
        id: task-history
        uses: actions/upload-artifact@v6
        with:
          name: ci-history-${{ inputs.task-id }}-${{ github.run_attempt }}
          path: .omo/ci/results/
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload task evidence including failures
        if: ${{ always() && steps.task-history.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: ci-result-${{ inputs.task-id }}
          path: .omo/ci/results/
          overwrite: true
          include-hidden-files: true
          if-no-files-found: error
