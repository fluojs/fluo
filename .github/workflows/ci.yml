name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      profile:
        type: string
        required: true
      source-sha:
        type: string
        required: true
      base-sha:
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.profile || 'pr' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Resolve verification plan
    runs-on: ubuntu-24.04-arm
    outputs:
      source-sha: ${{ steps.plan.outputs.source_sha }}
      tasks: ${{ steps.plan.outputs.tasks }}
      image-cache-key: ${{ steps.environment.outputs.cache_key }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source-sha || github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Read locked bootstrap version
        id: version
        run: node -e "const fs=require('node:fs');const l=JSON.parse(fs.readFileSync('tooling/ci/environment.lock.json','utf8'));fs.appendFileSync(process.env.GITHUB_OUTPUT,'node='+l.node.primary.version+'\n')"
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ steps.version.outputs.node }}
          package-manager-cache: false
      - uses: pnpm/action-setup@v5
      - name: Freeze source and task plan
        id: plan
        env:
          BASE_SHA: ${{ inputs.base-sha || github.event.pull_request.base.sha }}
          PROFILE: ${{ inputs.profile || 'pr' }}
        run: |
          mkdir -p .omo/ci-plan
          node tooling/ci/verify-local.mjs --plan --base-ref "$BASE_SHA" --profile "$PROFILE" > .omo/ci-plan/plan.json
          node --input-type=module <<'EOF'
          import { readFileSync, appendFileSync } from 'node:fs';
          const plan = JSON.parse(readFileSync('.omo/ci-plan/plan.json', 'utf8'));
          const tasks = plan.tasks.map(({ id }) => id).filter(id => !['build', 'compatibility-floor', 'compatibility-next'].includes(id));
          if (tasks.length !== 13 || plan.tasks.length + 2 !== 18) throw new Error('Unexpected expanded CI job count');
          appendFileSync(process.env.GITHUB_OUTPUT, `source_sha=${plan.identity.headSha}\ntasks=${JSON.stringify(tasks)}\n`);
          EOF
      - name: Report available runtime updates without changing the lock
        if: github.event_name == 'schedule'
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync, appendFileSync } from 'node:fs';
          const lock = JSON.parse(readFileSync('tooling/ci/environment.lock.json', 'utf8'));
          const response = await fetch('https://nodejs.org/dist/index.json', { signal: AbortSignal.timeout(10000) });
          if (!response.ok) throw new Error(`Node release lookup failed: ${response.status}`);
          const releases = await response.json();
          if (!Array.isArray(releases)) throw new Error('Invalid Node release index');
          const rows = [];
          for (const [major, target] of [[24, 'primary'], [26, 'compat26']]) {
            const versions = releases.map(item => item.version).filter(version =>
              typeof version === 'string' && new RegExp(`^v${major}\\.\\d+\\.\\d+$`).test(version));
            versions.sort((a, b) => {
              const left = a.slice(1).split('.').map(Number);
              const right = b.slice(1).split('.').map(Number);
              return right[1] - left[1] || right[2] - left[2];
            });
            if (!versions.length) throw new Error(`Missing Node ${major} releases`);
            rows.push(`| ${major} | ${lock.node[target].version} | ${versions[0].slice(1)} |`);
          }
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `## Runtime lock updates\n\nReview lock changes; this run does not update versions automatically.\n\n| Node | Locked | Available |\n| --- | --- | --- |\n${rows.join('\n')}\n`);
          EOF
      - name: Compute immutable image cache key
        id: environment
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { loadEnvironmentLock, imageKeyFor } from './tooling/ci/verification-environment.mjs';
          const key = imageKeyFor(loadEnvironmentLock(), readFileSync('tooling/ci/Dockerfile')).slice(7);
          appendFileSync(process.env.GITHUB_OUTPUT, `cache_key=fluo-linux-arm64-${key}\n`);
          EOF
      - name: Restore immutable verification image
        id: image-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/fluo-verification-image
          key: ${{ steps.environment.outputs.cache_key }}
      - name: Load cached image
        if: steps.image-cache.outputs.cache-hit == 'true'
        run: docker load --input "$RUNNER_TEMP/fluo-verification-image/image.tar"
      - name: Prepare and archive verified image
        if: steps.image-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/fluo-verification-image"
          node --input-type=module <<'EOF'
          import { execFileSync } from 'node:child_process';
          import { prepareVerificationEnvironment } from './tooling/ci/verification-environment.mjs';
          const { tag } = prepareVerificationEnvironment();
          execFileSync('docker', ['save', '--output', `${process.env.RUNNER_TEMP}/fluo-verification-image/image.tar`, tag], { stdio: 'inherit' });
          EOF
      - name: Upload frozen plan
        uses: actions/upload-artifact@v6
        with:
          name: ci-plan
          path: .omo/ci-plan/plan.json
          overwrite: true
          include-hidden-files: true
          if-no-files-found: error
      - name: Verify the host runner against real Docker fixtures
        run: node tooling/ci/verification-runner.mjs --plan .omo/ci-plan/plan.json --host-checks --output .omo/ci/host-results --artifacts .omo/ci/artifacts
      - name: Preserve this attempt's host integration evidence
        if: ${{ always() }}
        id: host-history
        uses: actions/upload-artifact@v6
        with:
          name: ci-history-host-checks-${{ github.run_attempt }}
          path: .omo/ci/host-results/
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload host integration evidence
        if: ${{ always() && steps.host-history.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: ci-result-host-checks
          path: .omo/ci/host-results/
          overwrite: true
          include-hidden-files: true
          if-no-files-found: error

  build:
    name: Primary build
    needs: plan
    uses: ./.github/workflows/node-verification.yml
    with:
      task-id: build
      source-sha: ${{ needs.plan.outputs.source-sha }}
      image-cache-key: ${{ needs.plan.outputs.image-cache-key }}

  verification:
    name: Verify task (${{ matrix.task }})
    needs: [plan, build]
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJSON(needs.plan.outputs.tasks) }}
    uses: ./.github/workflows/node-verification.yml
    with:
      task-id: ${{ matrix.task }}
      source-sha: ${{ needs.plan.outputs.source-sha }}
      image-cache-key: ${{ needs.plan.outputs.image-cache-key }}
      build-artifact-id: ${{ needs.build.outputs.build-artifact-id }}
      build-artifact-digest: ${{ needs.build.outputs.build-artifact-digest }}

  compatibility:
    name: Node compatibility (${{ matrix.task }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        task: [compatibility-floor, compatibility-next]
    uses: ./.github/workflows/node-verification.yml
    with:
      task-id: ${{ matrix.task }}
      source-sha: ${{ needs.plan.outputs.source-sha }}
      image-cache-key: ${{ needs.plan.outputs.image-cache-key }}

  verify:
    name: Verify
    if: ${{ always() }}
    needs: [plan, build, verification, compatibility]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source-sha || github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Read locked bootstrap version
        id: version
        run: node -e "const fs=require('node:fs');const l=JSON.parse(fs.readFileSync('tooling/ci/environment.lock.json','utf8'));fs.appendFileSync(process.env.GITHUB_OUTPUT,'node='+l.node.primary.version+'\n')"
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ steps.version.outputs.node }}
          package-manager-cache: false
      - uses: actions/download-artifact@v5
        with:
          name: ci-plan
          path: .omo/ci-plan
      - uses: actions/download-artifact@v5
        with:
          pattern: ci-result-*
          path: .omo/ci/results
          merge-multiple: true
      - name: Acquire build outputs for evidence validation
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build.outputs.build-artifact-id }}
          ARTIFACT_DIGEST: ${{ needs.build.outputs.build-artifact-digest }}
          SOURCE_SHA: ${{ needs.plan.outputs.source-sha }}
        run: node tooling/ci/acquire-build-artifact.mjs --id "$ARTIFACT_ID" --digest "$ARTIFACT_DIGEST" --sha "$SOURCE_SHA" --name "ci-build-$SOURCE_SHA" --run-id "$GITHUB_RUN_ID" --output .omo/ci/artifacts/build.tar
      - name: Restore documentation outputs for evidence validation
        uses: actions/download-artifact@v5
        with:
          name: docs-site-${{ needs.plan.outputs.source-sha }}
          path: .omo/ci/artifacts/docs-site
      - name: Require every planned capability and job result
        env:
          VERIFICATION_RESULTS: ${{ toJSON(needs) }}
        run: node tooling/ci/verification-runner.mjs --plan .omo/ci-plan/plan.json --aggregate --output .omo/ci/results --artifacts .omo/ci/artifacts
